[project]
name = "labpilot"
version = "0.1.0"
description = "光学实验 Agent 助手，基于 LangGraph ReAct 智能体，支持 PDH/PNA 设备控制、长期记忆与 Skill 技能系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LabPilot Authors" },
]

# 与 requirements.txt 保持一致；uv 会按 wheel 优先策略安装，Windows + Python 3.12
# 下 chromadb / torch / orjson / xxhash / ormsgpack 都有预编译 wheel，无需 C++ 编译工具链。
dependencies = [
    # ===== LangGraph core =====
    "langgraph>=0.6.0",
    "langgraph-checkpoint>=2.1.0",
    "langgraph-prebuilt>=0.6.0",
    "langgraph-sdk>=0.2.0",

    # ===== LangChain =====
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",

    # ===== Anthropic =====
    "anthropic>=0.40.0",

    # ===== OpenAI-compatible provider bridge =====
    # 仅在 OPENAI_API_KEY 设置时被 llm.py 启用，自动起 LiteLLM Proxy
    # 把 Anthropic 协议翻译成任意 OpenAI 兼容后端
    # (DeepSeek/Qwen/GLM/Ollama/vLLM/OpenAI)。本地推理时填
    # LITELLM_MODEL=ollama/llama3.1 之类即可。
    "litellm[proxy]>=1.50.0",

    # ===== Utilities =====
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "orjson>=3.9",
    "ormsgpack>=1.0",
    "xxhash>=3.0",

    # ===== LangGraph CLI (server mode, requires Python 3.11+) =====
    "langgraph-cli>=0.4.0",
    "click>=8.0",

    # ===== WebSocket / HTTP server =====
    "websockets>=12.0",
    "uvicorn>=0.27.0",
    "fastapi>=0.110.0",

    # ===== Instrument control =====
    "RsInstrument>=1.124.0",

    # ===== Memory system =====
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
# 未来若想 `uv run labpilot-repl` 直接进 REPL，可在此注册
# labpilot-repl = "src.agent.repl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 仓库根目录就是源码所在，不强制 include 规则
packages = ["src"]

# ================= uv 配置 =================
[tool.uv]
# 这是一个应用项目，不需要被打包分发
package = false

# 默认自动管理 Python 解释器（已检测到 3.12）
# 如需固定版本可解开下行：managed = true
managed = true

# 锁文件即真相；CI/协作者靠 uv.lock 复现一致环境
# 生成锁文件：uv lock  /  安装：uv sync